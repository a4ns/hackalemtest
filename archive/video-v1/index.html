<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HackAlem AI — intro</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Brand fonts, taken from hackalem.ai (OFL). Cyrillic + Latin subsets of the variable fonts. */
      @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/fonts/Manrope-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/fonts/Manrope-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "JetBrains Mono"; font-weight: 400 800; src: url("assets/fonts/JetBrainsMono-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "JetBrains Mono"; font-weight: 400 800; src: url("assets/fonts/JetBrainsMono-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060b16; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #060b16; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="15" data-fps="30">
      <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <!-- Soundtrack: synthesised from scratch by audio/build_audio.py (reads config/cues.json). 15.000 s, 48 kHz, stereo. -->
      <audio id="mix" src="assets/audio/hackalem-intro-mix.wav" data-start="0" data-duration="15" data-track-index="1" data-volume="1"></audio>
    </div>
    <script src="config/cues.js"></script>
    <script src="src/hk-engine.js"></script>
    <script>
      // The picture is a pure function of time (src/hk-engine.js, drawn on every `hf-seek`).
      // The GSAP timeline only carries the composition length.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
